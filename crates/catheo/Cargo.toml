[package]
name = "catheo"
description = "Category theory at the speed of Rust: categorical pipelines compiled to flat imperative loops."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"

[dependencies]
catheo-macros.workspace = true

[dev-dependencies]
criterion.workspace = true
trybuild.workspace = true
# §6.1 decision gates: deterministic allocation counting + fused-emission
# shape lockstep against the macro compiler.
catheo-counting-alloc.workspace = true
catheo-parser.workspace = true
quote.workspace = true
# The observable consumer seam (examples/instrumented_pipeline.rs):
# `tracing` spans around the pipeline run and `miette` help text on the
# error path. Dev-only — no shipped artifact links either crate.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.21"

[lints]
workspace = true

[[bench]]
name = "kernels"
harness = false

