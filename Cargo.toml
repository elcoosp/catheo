[workspace]
resolver = "3"
members = [
    "crates/catheo",
    "crates/catheo-macros",
    "crates/catheo-parser",
    "crates/catheo-counting-alloc",
]

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/elcoosp/catheo"
description = "Category theory at the speed of Rust: categorical pipelines compiled to flat imperative loops."
authors = ["elcoosp"]

[workspace.dependencies]
# Third-party (pinned to latest crates.io releases, researched 2026-11-06,
# re-verified at the v0.3.0 release: all five are the latest stable versions)
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9", default-features = false, features = ["derive", "parsing", "printing", "proc-macro", "clone-impls", "extra-traits"] }
trybuild = "1.0.122"
criterion = "0.8.2"

# Internal
catheo-parser = { path = "crates/catheo-parser", version = "0.4.1" }
catheo-macros = { path = "crates/catheo-macros", version = "0.4.1" }
catheo-counting-alloc = { path = "crates/catheo-counting-alloc", version = "0.4.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
# Rationale (v0.5): the facade declares `extern crate self as catheo`
# (crates/catheo/src/lib.rs) so macro-generated `::catheo::…` paths resolve
# inside the facade's own unit tests and doctests (§3.4 codegen). The alias
# is unused at the top level *by construction*; the allowance lives here —
# lint configuration with its rationale, not a site-level suppression — and
# `tests/v05_gates.rs::the_only_declared_extern_crate_is_the_facade_self_alias`
# keeps this the only declared `extern crate` in the tree, so the allowance
# can never silently license a second one. (Migrated from the former
# `#[expect(unused_extern_crates)]` in lib.rs: the gate-5 posture is zero
# lint-attribute suppressions in source.)
unused_extern_crates = "allow"

# Pedantic with zero exemptions: every lint is either honored in the code or,
# where ARCHITECTURE.md mandates the flagged pattern (§2.2 #[inline(always)]
# kernels), suppressed per-site with #[expect] — which errors the moment the
# pattern stops matching, so no suppression can silently rot. No
# #[allow]/allow-list anywhere in the workspace, enforced by
# `cargo clippy --workspace --all-targets -- -D warnings` in CI.
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

# Release profile tuning: proc-macro workspace, keep binaries lean and builds debuggable.
[profile.bench]
debug = true
