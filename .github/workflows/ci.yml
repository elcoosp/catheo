name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (pedantic deny, no allow-list, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (trybuild pinned + §6.2 fusion properties + §6.3/kernel gates)
    # Pinned to the exact toolchain that generated the `tests/ui/*.stderr`
    # snapshots: rustc diagnostics are not stable across versions and
    # trybuild compares byte-for-byte (§6.2). The §6.3 expansion-budget and
    # kernel-linearity gates are plain integration tests, so this job
    # enforces them deterministically.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo test --workspace --all-features

  benches:
    name: benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      # Shortened measurement window: this job gates compile-and-run health
      # of all eleven bench targets. The deterministic gates (§6.1 decision
      # gates, §6.3 expansion budget, kernel linearity) run under the plain
      # `cargo test --workspace` job (they are integration tests in
      # `tests/`); the §6.1 verdict itself is read from criterion output
      # and recorded in docs/ARCHITECTURE.md §6.1. Scoped per target: a
      # workspace-wide `cargo bench` would feed criterion's flags to the
      # libtest harnesses, which reject them.
      - run: cargo bench -p catheo-parser --bench parse -- --warm-up-time 0.5 --measurement-time 1.5 --sample-size 20
      - run: cargo bench -p catheo --bench kernels -- --warm-up-time 0.5 --measurement-time 1.5 --sample-size 20
      - run: cargo bench -p catheo --bench abc -- --warm-up-time 0.3 --measurement-time 1 --sample-size 15
      - run: cargo bench -p catheo --bench error_chains -- --warm-up-time 0.3 --measurement-time 1 --sample-size 15
      - run: cargo bench -p catheo --bench combinators -- --warm-up-time 0.3 --measurement-time 1 --sample-size 15
      - run: cargo bench -p catheo --bench traverse -- --warm-up-time 0.3 --measurement-time 1 --sample-size 15
      - run: cargo bench -p catheo --bench join -- --warm-up-time 0.3 --measurement-time 1 --sample-size 15
      - run: cargo bench -p catheo --bench monad -- --warm-up-time 0.3 --measurement-time 1 --sample-size 15
      - run: cargo bench -p catheo --bench filter_map -- --warm-up-time 0.3 --measurement-time 1 --sample-size 15
      - run: cargo bench -p catheo --bench hatches -- --warm-up-time 0.3 --measurement-time 1 --sample-size 15
      - run: cargo bench -p catheo --bench ascription -- --warm-up-time 0.3 --measurement-time 1 --sample-size 15
      - run: cargo bench -p catheo --bench foldable -- --warm-up-time 0.3 --measurement-time 1 --sample-size 15
      - run: cargo bench -p catheo --bench filterable -- --warm-up-time 0.3 --measurement-time 1 --sample-size 15

  macro-stats:
    name: nightly -Zmacro-stats (§5.3)
    # The architecture requires expansion statistics on every CI build from
    # the first commit: expansion time and generated token volume are
    # tracked, and a breach of the §6.3 budget rejects the PR. The
    # 50-pipeline fixture (`crates/catheo/tests/expansion_fixture.rs`) is
    # the §6.1 compile-time corpus this job measures. The job is advisory
    # (nightly breakage must not block unrelated work) but its artifact is
    # the evidence trail for the budget.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo build --workspace --all-targets -vv 2>&1 | tee macro-stats.log
        env:
          RUSTFLAGS: -Zmacro-stats
      - uses: actions/upload-artifact@v7
        with:
          name: macro-stats
          path: macro-stats.log
          if-no-files-found: warn
