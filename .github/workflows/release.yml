name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: git-cliff changelog + GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog for the tagged release
        uses: orhun/git-cliff-action@v4.9.1
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3.0.4
        with:
          body_path: CHANGES.md
